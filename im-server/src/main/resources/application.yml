server:
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

spring:
  profiles:
    active: dev
  application:
    name: im-server
  data:
    redis:
      host: ${im.redis.host}
      port: ${im.redis.port}
      password: ${im.redis.password}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${im.rabbitmq.host}
    port: ${im.rabbitmq.port}
    virtual-host: /
    username: ${im.rabbitmq.username}
    password: ${im.rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 20
        max-concurrency: 30
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 5000ms

netty:
  websocket:
    port: 8000
    cluster-id: 1

serializer:
  algorithm: Json

jwt:
  accessToken:
    secret: ${im.jwt.access-secret}
