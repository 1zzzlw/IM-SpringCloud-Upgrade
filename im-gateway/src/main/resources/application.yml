server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: im-gateway
  data:
    redis:
      host: ${im.redis.host}
      port: ${im.redis.port}
      password: ${im.redis.password}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  cloud:
    nacos:
      discovery:
        server-addr: ${im.nacos.host}:8848
    gateway:
      routes:
        - id: im-auth
          uri: lb://im-auth
          predicates:
            - Path=/user/**
        - id: im-chat
          uri: lb://im-chat
          predicates:
            - Path=/ai-message/**, /conversation/**, /message/**, /redPacket/**
        - id: im-social
          uri: lb://im-social
          predicates:
            - Path=/apply/**, /friend/**
        - id: im-content
          uri: lb://im-content
          predicates:
            - Path=/favorites/**
        - id: im-moments
          uri: lb://im-moments
          predicates:
            - Path=/moments/**
        - id: im-pay
          uri: lb://im-pay
          predicates:
            - Path=/wallet/**

jwt:
  access-secret-key: ${im.jwt.access-secret}
  fresh-secret-key: ${im.jwt.refresh-secret}
  access-expiration: 3600000
  refresh-expiration: 31536000000
  token-name: Authorization

auth:
  excludePaths:
    # --- 登录注册相关 ---
    - "/user/login"
    - "/user/pendingLogin"
    - "/user/register"
    - "/user/verifyCode"
    - "/user/phoneCode"
    # --- 文件上传相关（分块上传在业务层校验） ---
    - "/message/checkUploaded"
    - "/message/uploadChunk"
    # --- 静态资源与接口文档 (Knife4j/Swagger) ---
    - "/swagger-ui/**"
    - "/v3/api-docs/**"
    - "/webjars/**"
    - "/doc.html/**"
    - "/doc.html"
    - "/swagger-resources/**"
    # --- 系统错误 ---
    - "/error/**"

  refreshPaths:
    - "/user/refreshToken/**"
    - "/message/verifyUploadToken/**"
    - "/message/merge"
    - "/message/init/list/**"
    - "/conversation/init/list"
    - "/friend/init/list"
