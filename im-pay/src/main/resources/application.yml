server:
  port: 8086
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

spring:
  profiles:
    active: dev
  application:
    name: im-pay
  cloud:
    nacos:
      discovery:
        server-addr: ${im.nacos.host}:8848
    openfeign:
      okhttp:
        enabled: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${im.mysql.host}:${im.mysql.port}/${im.mysql.database}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${im.mysql.username}
    password: ${im.mysql.password}
  data:
    redis:
      host: ${im.redis.host}
      port: ${im.redis.port}
      password: ${im.redis.password}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${im.rabbitmq.host}
    port: ${im.rabbitmq.port}
    virtual-host: /
    username: ${im.rabbitmq.username}
    password: ${im.rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zzzlew.domain.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zzzlew.mapper: debug
    com.zzzlew.service: info
