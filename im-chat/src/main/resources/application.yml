server:
  port: 8082
  compression:
    enabled: true
    mime-types: application/json,text/plain,text/html
    min-response-size: 1024

spring:
  profiles:
    active: dev
  application:
    name: im-chat
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    nacos:
      discovery:
        server-addr: ${im.nacos.host}:8848
    openfeign:
      okhttp:
        enabled: true
  ai:
    ollama:
      base-url: ${im.ai.ollama.base-url}
      chat:
        model: ${im.ai.ollama.model}
    zhipuai:
      api-key: ${im.ai.zhipu.api-key}
      chat:
        options:
          model: glm-5.1
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${im.mysql.host}:${im.mysql.port}/${im.mysql.database}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${im.mysql.username}
    password: ${im.mysql.password}
  data:
    redis:
      host: ${im.redis.host}
      port: ${im.redis.port}
      password: ${im.redis.password}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  rabbitmq:
    host: ${im.rabbitmq.host}
    port: ${im.rabbitmq.port}
    virtual-host: /
    username: ${im.rabbitmq.username}
    password: ${im.rabbitmq.password}
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 10
        concurrency: 20
        max-concurrency: 30
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-attempts: 3
          max-interval: 5000ms

minio:
  endpoint: ${im.minio.endpoint}
  accessKey: ${im.minio.access-key}
  secretKey: ${im.minio.secret-key}
  avatarBucket: zzz-im-avatar
  imageBucket: zzz-im-image
  videoBucket: zzz-im-video
  audioBucket: zzz-im-audio
  fileBucket: zzz-im-file
  favoriteBucket: zzz-im-favorite
  momentsBucket: zzz-im-moment
  imagePath: image
  videoPath: video
  expireIn: 180

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zzzlew.domain.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.zzzlew.mapper: debug
    com.zzzlew.server: info
    com.zzzlew.controller: info

knife4j:
  enable: true
springdoc:
  api-docs.enabled: true
